<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <title>Sign-in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container">
        <div class="sign-in">
            <div class="header-form">
                <a href="/src/main/webapp/WEB-INF/Login/login.html" class="back-button">
                    <i class="bi bi-arrow-left-circle" id="voltar"></i>
                </a>
                <h1>Crie sua conta</h1>
            </div>
            <form id="cadastroForm">
                <div class="input">
                    <label for="username">Nome Completo</label>
                    <input type="text" id="username" placeholder="Digite seu nome completo" required>
                </div>

                <div class="input">
                    <label for="matricula">Número de Matrícula</label>
                    <input type="text" id="matricula" placeholder="Digite seu número de matrícula" required>
                </div>

                <div class="input">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="input">
                    <label for="password">Senha</label>
                    <input type="text" id="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-cadastrar">Cadastrar</button> <!-- POR FAVOR FAZER ELE GURADAR OS DADOS E  REDIRECIONAR PARA A TELA DE LOGIN, NÃO CONSEGUI PELO TIPO DO BOTÃO SER SUBMIT -->
            </form>
        </div>

        <div id="imagem">
            <img src="/src/main/webapp/WEB-INF/assets/livro com lampada.png" alt="Livro com Lâmpada">
        </div>
</body>

</html>
