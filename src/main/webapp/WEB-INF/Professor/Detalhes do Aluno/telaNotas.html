<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colégio Mémora</title>
    <link rel="stylesheet" href="telaNotas.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <header>
        <div class="header">
            <img src="/src/main/webapp/WEB-INF/assets/logo.png" alt="logo Colégio Mémora" id="logo">
            <div id="professor">
                <p>Prof. Carlos Lima <br>Português</p> <!-- Fazer validação com JSP -->
                <img src="/src/main/webapp/WEB-INF/assets/foto de perfil (antony).png" alt="foto de perfil do professor">
                <!-- Fazer validação com JSP -->
            </div>
        </div>
    </header>
    <main>
        <a href="/src/main/webapp/WEB-INF/Professor/Tela Inicial/telaInicial.html">
            <div id="btn-voltar">
                <i class="bi bi-arrow-left-circle"></i>
                <p>Voltar</p>
            </div>
        </a>
        <div class="bloco-aluno">
            <div id="icone-user">
                <i class="bi bi-person"></i>
            </div>
            <div>
                <h2>João Ricardo Alves</h2>
                <p>Matrícula: 1234567</p>
            </div>
        </div>

        <div class="options">
            <div id="aba-notas">
                <i class="bi bi-journal"></i>
                <p>Notas</p>
            </div>
            <a href="/src/main/webapp/WEB-INF/Professor/Detalhes do Aluno/telaObservacoes.html">
                <div id="aba-observações">
                    <i class="bi bi-chat-left-dots"></i>
                    <p>Observações</p>
                </div>
            </a>
        </div>

        <div id="pre-notas">
            <h2>Notas em Português</h2>
            <button id="btn-adicionar-nota">
                <i class="bi bi-plus"></i>
                <p>Adicionar Nota</p>
            </button>
        </div>

        <div id="box-adicionar-nota">
            <h3>Lançamento de Nota</h3>

            <div class="inputs-nota">
                <select>
                    <option>1ª Nota</option>
                    <option>2ª Nota</option>
                </select>

                <input type="number" id="nota-atribuida" placeholder="Digite a nota">
            </div>

            <div class="botoes-nota">
                <button id="cancelar-nota">Cancelar</button>
                <button id="salvar-nota">Concluir</button>
            </div>
        </div>

        <div id="box-editar-nota" style="display:none">

            <h3 id="titulo-edicao"></h3>

            <div id="bloco-digitar-nota">
                <input type="number" id="input-nota" placeholder="Digite a nova nota">

                <div class="botoes">
                    <button id="cancelar-edicao">Cancelar</button>
                    <button id="salvar-edicao">Salvar</button>
                </div>
            </div>

        </div>

        <div class="notas-container">
            <div class="nota-card" data-nota="1">
                <p>1ª Nota</p>
                <div class="edit-grade-and-grade">
                    <i class="bi bi-pencil-square editar-nota"></i>
                    <p class="valor-nota">8.3</p>
                </div>
            </div>
            <div class="nota-card" data-nota="2">
                <p>2ª Nota</p>
                <div class="edit-grade-and-grade">
                    <i class="bi bi-pencil-square editar-nota"></i>
                    <p class="valor-nota">-</p>
                </div>
            </div>
            <div class="nota-card">
                <p>Média</p>
                <div class="edit-grade-and-grade">
                    <p>-</p>
                </div>
            </div>

        </div>
    </main>
    <script src="/src/main/webapp/WEB-INF/Professor/Detalhes do Aluno/telaNotas.js"></script>
</body>

</html>
